name: Update Release Notes V1.2.2

on:
  push:
    branches:
      - fix-release-notes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show files and gh version
        run: |
          echo "=== files ==="
          ls -lh docs/RELEASE_NOTES_V1.2.2_FINAL.md
          wc -l docs/RELEASE_NOTES_V1.2.2_FINAL.md
          echo "=== gh version ==="
          gh --version
          echo "=== repo ==="
          echo "${{ github.repository }}"
          echo "=== token present? ==="
          if [ -n "${{ github.token }}" ]; then echo "token length ${#GH_TOKEN}"; else echo "no token"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Release via gh api (PATCH)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex
          echo "=== get release id ==="
          gh api repos/${{ github.repository }}/releases/tags/v1.2.2 --jq .id > /tmp/id.txt || { echo "failed to get release id"; cat /tmp/id.txt; exit 1; }
          RELEASE_ID=$(cat /tmp/id.txt)
          echo "Release ID: $RELEASE_ID"
          echo "=== current release ==="
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID --jq '{tag: .tag_name, name: .name, bodyLen: (.body|length)}' || echo "view failed"
          echo "=== patching release ==="
          # Use gh api PATCH with raw body file
          # Need to send body as string, gh api will handle JSON escaping with -F
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID -X PATCH -F tag_name="v1.2.2" -F name="v1.2.2 — Final Hardening & Financial Integrity" -F body="$(cat docs/RELEASE_NOTES_V1.2.2_FINAL.md)" --verbose || {
            echo "PATCH failed, trying alternative with --input"
            # Fallback: create JSON manually
            BODY=$(cat docs/RELEASE_NOTES_V1.2.2_FINAL.md | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
            echo "{\"tag_name\":\"v1.2.2\",\"name\":\"v1.2.2 — Final Hardening & Financial Integrity\",\"body\":$BODY}" > /tmp/patch.json
            cat /tmp/patch.json | head -c 500
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID -X PATCH --input /tmp/patch.json || echo "second PATCH also failed"
            exit 1
          }
          echo "=== after patch ==="
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID --jq '{tag: .tag_name, name: .name, bodyLen: (.body|length)}'
          echo "=== verifying ==="
          gh api repos/${{ github.repository }}/releases/tags/v1.2.2 --jq .body > /tmp/body.txt
          grep -q "449062d21cc9a109a77c1f631f908eb6c8524975" /tmp/body.txt && echo "Final Commit PASS" || (echo "FAIL" && cat /tmp/body.txt | head -n 50 && exit 1)
          grep -q "202 tests passed" /tmp/body.txt && echo "Validation PASS" || (echo "FAIL" && exit 1)
          grep -q "No active credentials" /tmp/body.txt && echo "Security PASS" || (echo "FAIL" && exit 1)
          if grep -q "لم يُدفع للـ remote بعد" /tmp/body.txt; then echo "Stale FAIL" && exit 1; else echo "Stale PASS"; fi
          echo "All checks PASS"

      - name: Verify assets still 4/4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/v1.2.2 --jq '.assets | length' | tee /tmp/count.txt
          COUNT=$(cat /tmp/count.txt)
          echo "Assets: $COUNT"
          gh api repos/${{ github.repository }}/releases/tags/v1.2.2 --jq '.assets[].name' | sort
          test "$COUNT" = "4" || exit 1
