name: Update Release Notes V1.2.2

on:
  push:
    branches:
      - fix-release-notes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test gh auth and view release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testing gh auth"
          gh auth status || echo "gh auth status failed"
          echo "Viewing release"
          gh release view v1.2.2 --json tagName,name,body --jq '{tag:.tagName, title:.name, len:(.body|length)}'
          echo "Listing assets"
          gh release view v1.2.2 --json assets --jq '.assets[].name'
          echo "Test done"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating release notes from docs/RELEASE_NOTES_V1.2.2_FINAL.md"
          cat docs/RELEASE_NOTES_V1.2.2_FINAL.md | head -n 20
          gh release edit v1.2.2 --title "v1.2.2 — Final Hardening & Financial Integrity" --notes-file docs/RELEASE_NOTES_V1.2.2_FINAL.md --verbose
          echo "Edit done"
          gh release view v1.2.2 --json body --jq .body | head -n 50
