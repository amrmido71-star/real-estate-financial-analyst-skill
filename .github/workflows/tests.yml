name: Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Lint with ruff (strict — must pass)
        run: |
          ruff check skill/ tests/

      - name: Type check V1.2 strict (must pass)
        run: |
          mypy skill/tools/integrated_model.py skill/tools/models skill/tools/model_runner.py skill/tools/model_validation.py skill/tools/reporting.py skill/tools/engines --ignore-missing-imports

      - name: Type check full (report only — legacy, informational; V1.2 strict above must pass)
        continue-on-error: true  # legacy report only — do not hide new failures, see V1.2 strict step
        run: |
          mypy skill/tools --ignore-missing-imports

      - name: Run tests with pytest (must pass)
        run: |
          pytest -v --tb=short --cov=skill/tools --cov-report=term-missing

      - name: Verify financial formulas (regression)
        run: |
          pytest tests/test_financial_calculations.py tests/test_project_metrics.py tests/test_investment_metrics.py tests/test_investment_mirr.py -v

      - name: Golden project smoke test
        run: |
          python examples/golden_project/run.py

