[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-financial-analyst-skill"
version = "1.2.2"
description = "Professional Senior Real Estate Financial Analyst Skill for AI Agents — Production-ready financial modeling, analysis, and reporting for real estate development companies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Real Estate Financial Analyst Skill", email = "skill@real-estate-finance.ai"}]
keywords = ["real-estate", "financial-analysis", "financial-modeling", "FP&A", "investment-analysis", "ai-skill", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0",
  "pandas>=1.5.0",
  "numpy>=1.23.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/amrmido71-star/real-estate-financial-analyst-skill"
Documentation = "https://github.com/amrmido71-star/real-estate-financial-analyst-skill#readme"
Repository = "https://github.com/amrmido71-star/real-estate-financial-analyst-skill"
Changelog = "https://github.com/amrmido71-star/real-estate-financial-analyst-skill/blob/main/CHANGELOG.md"
Issues = "https://github.com/amrmido71-star/real-estate-financial-analyst-skill/issues"

[tool.setuptools.packages.find]
include = ["skill*", "skill.tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"skill/tools/data_loader.py" = ["F401"]
"skill/tools/models/__init__.py" = ["F401"]


[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
